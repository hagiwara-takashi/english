<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.webmanifest">
<title>英単語10</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;color:#161616;background:#f5f6f8}
*{box-sizing:border-box} body{margin:0} button{font:inherit}
.wrap{max-width:620px;margin:auto;padding:20px 16px 40px}
.top{display:flex;justify-content:space-between;align-items:center;margin:4px 0 18px}
h1{font-size:25px;margin:0}.streak{font-size:14px;background:white;padding:8px 11px;border-radius:999px;box-shadow:0 1px 6px #0001}
.card{background:#fff;border-radius:22px;padding:22px;box-shadow:0 8px 30px #0000000c}
.sub{color:#6b7280;font-size:14px}.big{font-size:30px;font-weight:750;margin:24px 0;text-align:center;min-height:76px;display:grid;place-items:center}
.progress{height:8px;background:#e5e7eb;border-radius:99px;overflow:hidden;margin:12px 0 22px}.bar{height:100%;background:#111;width:0}
.choices{display:grid;gap:11px}.choice{border:1px solid #d8dce3;background:#fff;border-radius:15px;padding:15px;text-align:left;min-height:54px}
.choice:active{transform:scale(.99)}.correct{border-color:#1b8f4b;background:#eaf8ef}.wrong{border-color:#d84b4b;background:#fff0f0}
.next,.primary{width:100%;border:0;border-radius:15px;padding:15px;background:#111;color:#fff;font-weight:700;margin-top:16px}
.next[hidden]{display:none}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:14px}.stat{background:#fff;border-radius:16px;padding:13px;text-align:center}.n{font-size:21px;font-weight:800}
.tabs{display:flex;gap:8px;margin:0 0 12px;overflow:auto}.tab{white-space:nowrap;border:1px solid #ddd;background:#fff;border-radius:999px;padding:8px 11px}.tab.on{background:#111;color:#fff}
.note{font-size:12px;color:#777;line-height:1.5;margin-top:15px}.result{text-align:center}.score{font-size:54px;font-weight:850;margin:12px 0}
.smallbtn{border:0;background:transparent;text-decoration:underline;color:#555;padding:10px}
</style>
</head>
<body><main class="wrap">
<div class="top"><h1>英単語10</h1><div class="streak" id="streak">🔥 0日連続</div></div>
<div class="tabs" id="tabs"></div>
<section class="card" id="quiz">
 <div class="sub" id="meta">今日の10問</div>
 <div class="progress"><div class="bar" id="bar"></div></div>
 <div class="big" id="prompt">スタート</div>
 <div class="choices" id="choices"></div>
 <button class="primary" id="start">今日の10問を始める</button>
 <button class="next" id="next" hidden>次の問題</button>
</section>
<div class="stats">
 <div class="stat"><div class="n" id="done">0</div><div class="sub">学習日数</div></div>
 <div class="stat"><div class="n" id="rate">-</div><div class="sub">正答率</div></div>
 <div class="stat"><div class="n" id="miss">0</div><div class="sub">要復習</div></div>
</div>
<p class="note">基本は「新しめ6問＋既習2問＋間違い復習2問」。同じ単語は日本語→英語／英語→日本語の両方で出題されます。履歴はこのiPhoneのブラウザ内に保存されます。</p>
</main>
<script src="words.js"></script>
<script>
const $=s=>document.querySelector(s), store=JSON.parse(localStorage.getItem("eng10")||'{"history":{},"days":{},"scope":"current"}');
const scopes={current:["u4","u5","u6"],review:["review","u1","u2","u3"],all:["review","u1","u2","u3","u4","u5","u6","general"]};
let quiz=[],i=0,score=0,locked=false;
function save(){localStorage.setItem("eng10",JSON.stringify(store))}
function day(){return new Date().toLocaleDateString("sv-SE")}
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function tabs(){let labels=[["current","10月〜"],["review","9月まで復習"],["all","全部"]];$("#tabs").innerHTML=labels.map(([k,v])=>`<button class="tab ${store.scope===k?"on":""}" data-k="${k}">${v}</button>`).join("");document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{store.scope=b.dataset.k;save();tabs()})}
function weightedPool(){
 let allowed=WORDS.filter(w=>scopes[store.scope].includes(w.unit));
 let missed=allowed.filter(w=>(store.history[w.en]?.wrong||0)>(store.history[w.en]?.right||0));
 let current=allowed.filter(w=>["u4","u5","u6"].includes(w.unit));
 let review=allowed.filter(w=>!["u4","u5","u6"].includes(w.unit));
 let picked=[];
 function add(arr,n){for(let w of shuffle(arr)){if(picked.length>=10||n--<=0)break;if(!picked.includes(w))picked.push(w)}}
 if(store.scope==="current"){add(missed,2);add(current,6);add(review,2)} else {add(missed,3);add(allowed,7)}
 add(allowed,10-picked.length); return shuffle(picked).slice(0,10);
}
function makeQuiz(){return weightedPool().map((w,idx)=>({w,dir:idx%2===0?"ja-en":"en-ja"}))}
function distractors(q){
 let key=q.dir==="ja-en"?"en":"ja", correct=q.w[key];
 let pool=WORDS.filter(x=>x.en!==q.w.en).map(x=>x[key]);
 return shuffle([correct,...shuffle([...new Set(pool)]).slice(0,3)]);
}
function render(){
 let q=quiz[i];locked=false;$("#meta").textContent=`${i+1} / 10　${q.dir==="ja-en"?"日本語 → 英語":"英語 → 日本語"}`;$("#bar").style.width=`${i*10}%`;
 $("#prompt").textContent=q.dir==="ja-en"?q.w.ja:q.w.en;$("#start").style.display="none";$("#next").hidden=true;
 let key=q.dir==="ja-en"?"en":"ja";$("#choices").innerHTML=distractors(q).map(x=>`<button class="choice">${x}</button>`).join("");
 document.querySelectorAll(".choice").forEach(b=>b.onclick=()=>answer(b,b.textContent===q.w[key]));
}
function answer(btn,ok){if(locked)return;locked=true;let q=quiz[i],h=store.history[q.w.en]||{right:0,wrong:0};if(ok){btn.classList.add("correct");h.right++;score++}else{btn.classList.add("wrong");h.wrong++;document.querySelectorAll(".choice").forEach(b=>{if(b.textContent===(q.dir==="ja-en"?q.w.en:q.w.ja))b.classList.add("correct")})}store.history[q.w.en]=h;save();$("#next").hidden=false}
$("#next").onclick=()=>{i++;if(i<10)render();else finish()}
function finish(){let d=day();store.days[d]={score,total:10};save();$("#bar").style.width="100%";$("#meta").textContent="今日の学習 完了";$("#prompt").innerHTML=`<div class="result"><div class="score">${score}/10</div><div>${score>=9?"すごい！":score>=7?"いい感じ！":"間違えた単語をまた出すよ"}</div></div>`;$("#choices").innerHTML="";$("#next").hidden=true;$("#start").style.display="block";$("#start").textContent="もう10問やる";stats()}
$("#start").onclick=()=>{quiz=makeQuiz();i=0;score=0;render()}
function stats(){let ds=Object.keys(store.days).sort(), total=ds.reduce((s,d)=>s+store.days[d].total,0),right=ds.reduce((s,d)=>s+store.days[d].score,0);$("#done").textContent=ds.length;$("#rate").textContent=total?Math.round(right/total*100)+"%":"-";$("#miss").textContent=Object.values(store.history).filter(h=>h.wrong>h.right).length;let streak=0,dt=new Date();for(;;){let k=dt.toLocaleDateString("sv-SE");if(store.days[k]){streak++;dt.setDate(dt.getDate()-1)}else{if(k===day()){dt.setDate(dt.getDate()-1);continue}break}}$("#streak").textContent=`🔥 ${streak}日連続`}
tabs();stats();
if("serviceWorker"in navigator)navigator.serviceWorker.register("./sw.js");
</script></body></html>
