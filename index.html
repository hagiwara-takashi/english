<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#173d35"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon.png"><title>テストまでの学習ノート</title><link rel="stylesheet" href="style.css"></head><body><main class="wrap">
<header><p class="eyebrow">中1・後期中間テスト / 2026.11.12</p><div class="top"><h1>今日の一歩を、<br>テストの自信に。</h1><span class="streak" id="countdown"></span></div><p class="sub">英語と漢字。ひとつずつ、確かめながら。</p></header>
<p id="storage" class="notice" hidden role="alert"></p><p id="message" role="status" aria-live="polite"></p>
<nav class="tabs" aria-label="教科"><button id="english" class="tab">英語</button><button id="kanji" class="tab">漢字の読み</button></nav>
<section id="home"><div class="card"><p class="eyebrow" id="subject-title"></p><h2 id="status-title"></h2><p id="status-note" class="sub"></p><div class="stats"><div><div class="n" id="learned">0</div><span class="sub">学習済み</span></div><div><div class="n" id="mistakes">0</div><span class="sub">復習する問題</span></div><div><div class="n" id="accuracy">—</div><span class="sub">正答率</span></div></div></div><div id="courses" class="courses"></div><button id="review" class="secondary">間違えた問題を復習</button></section>
<section id="quiz" class="card" hidden aria-label="4択学習"><div class="top"><span id="meta" class="sub"></span><button id="back" class="smallbtn">中断して戻る</button></div><progress id="progress" max="20" value="0" aria-label="回答数"></progress><p class="sub" id="direction"></p><h2 class="big" id="prompt" tabindex="-1"></h2><div id="choices" class="choices"></div><p id="feedback" role="status" aria-live="polite"></p><button id="next" class="primary" hidden>次の問題</button></section>
<section id="result" class="card" hidden><p class="eyebrow">おつかれさま！</p><h2 id="result-title"></h2><p id="result-note"></p><button id="return" class="primary">学習一覧へ戻る</button></section>
<details class="card settings"><summary>教材と学習記録</summary><p class="sub">教材写真を確認できていないため、問題は未登録です。推定・仮練習データは出題しません。</p><p id="dataset-info"></p><label class="filebtn">確認済み教材JSONを取り込む<input id="import" type="file" accept=".json,application/json"></label><p class="note">取り込み前に全件検証します。教材が変わる場合は、学習記録をリセットするか確認します。</p><button id="export" class="secondary">教材・進捗をバックアップ</button><label class="filebtn">バックアップを復元<input id="restore" type="file" accept=".json,application/json"></label><p class="note">記録はこの端末・このブラウザに保存されます。端末間の自動同期はありません。</p></details>
<footer class="note">11月12日へ、焦らず着実に。<br>元の「英単語10」の画面構成を引き継いだテスト対策版。<br>旧版の学習記録は変更しません。</footer></main><script src="data.js"></script><script src="core.js"></script><script src="app.js"></script></body></html>
